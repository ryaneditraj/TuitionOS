name: Feature request
description: Suggest an improvement to Trinity One
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who hits this, a student, a teacher, or an admin?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you want Trinity One to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
